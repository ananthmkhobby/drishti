# Railway deployment config — backend
# Deploy: connect repo in Railway dashboard → set env vars below → deploy
# Docs: https://docs.railway.app/

[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"

[deploy]
  startCommand = "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2"
  healthcheckPath = "/health"
  healthcheckTimeout = 30
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 3

# Environment variables to set in Railway dashboard:
# DATABASE_URL        — auto-provided by Railway PostgreSQL addon (postgres:// format)
# REDIS_URL           — auto-provided by Railway Redis addon
# JWT_SECRET_KEY
# OPENAI_API_KEY
# USE_S3              — true (use S3/R2) or false (local disk — not recommended in prod)
# AWS_ACCESS_KEY_ID
# AWS_SECRET_ACCESS_KEY
# AWS_REGION
# S3_BUCKET
# ALLOWED_ORIGINS     — https://your-vercel-app.vercel.app
# ENVIRONMENT         — production
