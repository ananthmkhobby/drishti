version: "3.9"

# Spins up PostgreSQL and Redis for local development.
# Use: make docker-up  (starts both in background)
#      make docker-down (stops and removes containers)
#
# NOT required for the SQLite dev track — see docs/LOCAL_RUNBOOK.md.

services:
  postgres:
    image: postgres:16-alpine
    container_name: aci-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aci
      POSTGRES_PASSWORD: aci
      POSTGRES_DB: aci
    ports:
      - "5432:5432"
    volumes:
      - aci_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aci -d aci"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aci-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aci_postgres_data:
